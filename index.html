<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створення публікації — Практична робота №2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-container">
        <div class="form-card">
            
            <header class="form-header">
                <h1 class="form-title">Create Post</h1>
                <p class="form-subtitle">Створи нову публікацію</p>
            </header>

            <form class="post-form" action="#" method="POST" novalidate>
                
                <div class="form-group">
                    <label for="post-title" class="form-label">Назва публікації</label>
                    <input 
                        type="text" 
                        id="post-title" 
                        name="title" 
                        class="form-input" 
                        placeholder="Введіть назву"
                    >
                </div>

                <div class="form-group">
                    <label for="post-description" class="form-label">Опис *</label>
                    <textarea 
                        id="post-description" 
                        name="description" 
                        class="form-textarea" 
                        placeholder="Розкажіть про свою публікацію..." 
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Зображення *</label>
                    <div class="media-upload-box">
                        <svg class="upload-icon" aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <label for="post-category" class="form-label">Категорія *</label>
                    <select id="post-category" name="category" class="form-select" required>
                        <option value="" disabled selected>Оберіть категорію</option>
                        <option value="tech">Технології</option>
                        <option value="design">Дизайн</option>
                        <option value="lifestyle">Життя та стиль</option>
                    </select>
                </div>

                <div class="form-group-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_private" class="form-checkbox">
                        <span>Зробити публікацію приватною</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Скасувати</button>
                    <button type="submit" class="btn btn-primary">Опублікувати</button>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
